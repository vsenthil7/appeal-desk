# Devvit app manifest for Appealdesk
#
# `name:` must match the slug registered on developers.reddit.com — the slug
# (lowercase, hyphenated) is the deploy identifier. The product brand is still
# "Appealdesk" in user-facing strings; only this slug uses the hyphenated form.
#
# Run `devvit upload` to publish, `devvit playtest <subreddit>` to test live.
name: appeal-desk

# Permissions the app requests. Appealdesk needs the Reddit API at mod scope
# (to read removal actions and send modmail), Redis for storage, and the
# scheduler for SLA nudges. The AI layer is optional and gated behind a setting.
permissions:
  reddit: true
  redis: true
  scheduler: true
  http: false # Appealdesk is fully on-platform; no external services.

# Marketplace metadata
marketplace:
  category: moderation
  description: >
    A dedicated, fair appeals system for bans and removals. Structured intake,
    a mod-only appeals dashboard, per-user appeal history, duplicate detection,
    and templated civil replies — with optional, assistive (never decisive) AI
    triage and tone-softening.
